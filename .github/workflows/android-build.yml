name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.event.head_commit.message != 'repair: calculators + pdf'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply calculator and PDF source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Calculator: use a normal text input with Android numeric input mode.
          # This avoids WebView type=number IME quirks while preserving the existing calculation logic/state.
          p = Path('src/components/patient/PatientClinicalCalculators.tsx')
          s = p.read_text()
          old = '''const Field:React.FC<FieldProps>=({label,value,onChange,step='1',min,max,inputMode})=>(
            <div className="space-y-1"><div className="text-xs font-medium text-slate-600 dark:text-slate-300">{label}</div><input type="number" inputMode={inputMode||(step==='1'?'numeric':'decimal')} step={step} min={min} max={max} value={value===undefined?'':String(value)} onChange={e=>onChange(e.target.value)} autoComplete="off" className="w-full min-h-12 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 text-base text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" /></div>
          );'''
          new = '''const Field:React.FC<FieldProps>=({label,value,onChange,step='1',min,max,inputMode})=>(
            <div className="space-y-1"><div className="text-xs font-medium text-slate-600 dark:text-slate-300">{label}</div><input type="text" inputMode={inputMode||(step==='1'?'numeric':'decimal')} enterKeyHint="done" value={value===undefined?'':String(value)} onChange={e=>onChange(e.target.value)} autoComplete="off" autoCorrect="off" spellCheck={false} className="w-full min-h-12 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 text-base text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" /></div>
          );'''
          if old not in s:
              raise SystemExit('Calculator Field pattern not found')
          p.write_text(s.replace(old, new, 1))

          # PDF: remove the Latest Progress Notes card from the actual printable JSX.
          p = Path('src/components/PrintableView.tsx')
          s = p.read_text()
          start = s.find('<div className="md:col-span-3"><Card><SectionHeader icon={<ClipboardList')
          if start < 0:
              raise SystemExit('Latest Progress Notes card not found in PrintableView')
          end = s.find('</Card></div>', start)
          if end < 0:
              raise SystemExit('Latest Progress Notes card closing tag not found')
          end += len('</Card></div>')
          s = s[:start] + s[end:]
          calc = '<div className="md:col-span-2"><Card><SectionHeader icon={<Calculator'
          if calc not in s:
              raise SystemExit('Clinical Calculators PDF card not found')
          s = s.replace(calc, '<div className="md:col-span-5"><Card><SectionHeader icon={<Calculator', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/patient/PatientClinicalCalculators.tsx src/components/PrintableView.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source repair changes needed.'
          else
            git commit -m 'repair: calculators + pdf'
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Show Android signing certificate
        working-directory: android
        run: ./gradlew signingReport

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build Play release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
