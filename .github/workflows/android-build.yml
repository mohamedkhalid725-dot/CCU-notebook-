name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Echo Summary to Patient Overview
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/components/patient/PatientOverview.tsx';
            let local = fs.readFileSync(path, 'utf8');
            if (!local.includes('Echo Summary')) {
              const marker = '      {/* Edit Form or Read Mode */}';
              if (!local.includes(marker)) throw new Error('Overview insertion marker not found');
              const card = `      {/* Echo Summary */}
          <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div className="flex items-center justify-between gap-3">
              <div>
                <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <HeartPulse size={16} className="text-emerald-600 dark:text-emerald-400" />
                  Echo Summary
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Latest transthoracic / bedside echocardiography findings.</p>
              </div>
              <span className="px-2 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold uppercase">TTE / POCUS</span>
            </div>
            {patient.echoStudies?.length ? (() => {
              const echo = patient.echoStudies[0];
              const rows = [
                ['EF', echo.ef],
                ['LV Dimensions', echo.lvDimensions],
                ['LV Systolic Function', echo.lvSystolicFunction],
                ['RV Assessment', echo.rvAssessment],
                ['TAPSE', echo.tapse],
                ['LA / RA', echo.laRa],
                ['RWMA', echo.rwma],
                ['Diastolic Function', echo.diastolicFunction],
                ['Valvular Assessment', echo.valvularAssessment],
                ['PASP', echo.pasp],
                ['IVC', echo.ivc],
                ['Pericardium', echo.pericardium],
                ['Other Measurements', echo.otherMeasurements],
                ['Findings', echo.findings],
                ['Impression', echo.impression],
              ].filter(([, value]) => value);
              return (
                <>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {rows.map(([label, value]) => (
                      <div key={label} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-100 dark:border-slate-700">
                        <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">{label}</div>
                        <div className="text-xs text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">{value}</div>
                      </div>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-3 text-[10px] text-slate-400">
                    <span>Study: {echo.timestamp}</span>
                    {echo.imageUrl && <span>• Image available in Echo tab</span>}
                  </div>
                </>
              );
            })() : (
              <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-xs text-slate-400 italic">No echocardiography study recorded.</div>
            )}
          </div>

`;
              local = local.replace(marker, card + marker, 1);
              fs.writeFileSync(path, local);
            }

            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: context.sha});
            const remote = Buffer.from(current.data.content, 'base64').toString('utf8');
            if (remote.includes('Echo Summary')) {
              core.info('Echo Summary already committed.');
            } else {
              const patched = remote.replace('      {/* Edit Form or Read Mode */}', local.includes('Echo Summary') ? local.slice(local.indexOf('      {/* Echo Summary */}')) : '');
              if (!patched.includes('Echo Summary')) throw new Error('Patch generation failed');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'feat: add echo summary to patient overview',
                content: Buffer.from(patched, 'utf8').toString('base64'),
                sha: current.data.sha,
                branch: 'main'
              });
              core.info('Echo Summary committed to main.');
            }

      - name: Upload Patched Patient Overview Source
        uses: actions/upload-artifact@v4
        with:
          name: patient-overview-echo-patch
          path: src/components/patient/PatientOverview.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build Play release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
