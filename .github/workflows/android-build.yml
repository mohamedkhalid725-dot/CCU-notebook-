name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Build the current main branch and verify that the APK contains the latest web assets.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Verify Patient File has no Calculators tab
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "id: 'calculators'" src/components/PatientFileModal.tsx
          ! grep -q "PatientClinicalCalculators" src/components/PatientFileModal.tsx
          echo "Patient File calculator tab is removed from source."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Replace corrupted debug keystore
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/debug.keystore
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -keypass androiddebugkey \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Build Play release bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify Debug APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          keytool -printcert -jarfile "$APK" >/dev/null
          echo "Verified Debug APK: $APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.1.9-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.1.9-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.1.9-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
