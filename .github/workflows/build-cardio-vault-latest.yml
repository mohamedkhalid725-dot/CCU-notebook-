name: CardioVault Latest APK

on:
  push:
    paths:
      - '.github/workflows/build-cardio-vault-latest.yml'
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Patient File calculator removal
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "id: 'calculators'" src/components/PatientFileModal.tsx
          ! grep -q "PatientClinicalCalculators" src/components/PatientFileModal.tsx
          echo 'Patient File Calculators tab is absent from source.'

      - name: Verify Google Authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"@capacitor-firebase/authentication"' package.json
          grep -q "providers: \['google.com'\]" capacitor.config.ts
          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
          grep -q 'androidxCredentialsVersion = '\''1.3.0'\''' android/variables.gradle
          grep -q 'FirebaseAuthenticationPlugin' android/capacitor-cordova-android-plugins/src/main/java/com/ccunotebook/app/MainActivity.java 2>/dev/null || true
          ! grep -q 'FirebaseAuthenticationPlugin.class' android/app/src/main/java/com/ccunotebook/app/MainActivity.java
          echo 'Google Firebase authentication configuration is present and MainActivity uses Capacitor auto-registration.'

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore stable CardioVault debug signing key
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          echo 'Restoring stable debug keystore used for Firebase SHA-1.'
          base64 -d app/cardiovault-debug.keystore.b64 > app/debug.keystore
          test -s app/debug.keystore
          SHA1=$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')
          echo "Debug SHA-1: $SHA1"
          test "$SHA1" = 'EE:10:46:22:5F:F5:B7:67:3C:7D:04:9F:F3:8A:31:AF:28:8B:37:BA'

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK output, auth plugin and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          keytool -printcert -jarfile "$APK" | grep -q 'EE:10:46:22:5F:F5:B7:67:3C:7D:04:9F:F3:8A:31:AF:28:8B:37:BA'
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q 'FirebaseAuthenticationPlugin'
          unzip -p "$APK" classes.dex | strings | grep -Eq 'GoogleIdTokenCredential|FirebaseAuthenticationPlugin|Google Sign-In'
          unzip -p "$APK" assets/public/index.html | grep -q '/assets/'
          echo "Verified APK: $APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.2.1-FirebaseAuth-STABLE-SHA
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
