name: CardioVault Latest APK

on:
  push:
    paths:
      - '.github/workflows/build-cardio-vault-latest.yml'
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: CAPACITOR_BUILD=true npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare clean debug signing key
        working-directory: android
        run: |
          set -e
          rm -f app/debug.keystore
          keytool -genkeypair \
            -v \
            -keystore app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          echo '--- DEBUG KEY SHA-1 ---'
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA1:'
          echo '-----------------------'

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Verify APK output
        working-directory: android
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-LATEST-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
