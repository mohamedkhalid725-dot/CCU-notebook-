name: CardioVault Latest APK

on:
  push:
    paths:
      - '.github/workflows/build-cardio-vault-latest.yml'
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Patient File calculator removal
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "id: 'calculators'" src/components/PatientFileModal.tsx
          ! grep -q "PatientClinicalCalculators" src/components/PatientFileModal.tsx
          echo 'Patient File Calculators tab is absent from source.'

      - name: Verify Google Authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"@capacitor-firebase/authentication"' package.json
          grep -q "providers: \['google.com'\]" capacitor.config.ts
          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
          grep -q 'androidxCredentialsVersion = '\''1.3.0'\''' android/variables.gradle
          grep -q 'FirebaseAuthenticationPlugin.class' android/app/src/main/java/com/ccunotebook/app/MainActivity.java
          echo 'Google Firebase native authentication configuration is present.'

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare clean debug signing key
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/debug.keystore
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass androiddebugkey \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA1:'

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Verify APK output, auth plugin and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          keytool -printcert -jarfile "$APK" >/dev/null
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q 'FirebaseAuthenticationPlugin'
          unzip -p "$APK" classes.dex | strings | grep -Eq 'GoogleIdTokenCredential|FirebaseAuthenticationPlugin|Google Sign-In'
          unzip -p "$APK" assets/public/index.html | grep -q '/assets/'
          echo "Verified APK: $APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.2.0-GoogleAuth-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
