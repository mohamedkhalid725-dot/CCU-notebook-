name: Fix Auth Listener Dependency 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[security-bot5]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix auth listener dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          needle="  }, [activePin]);"
          if needle not in s: raise SystemExit('auth dependency target not found')
          s=s.replace(needle,"  }, []);",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: stabilize auth listener during PIN unlock [security-bot5]"
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-auth-dependency-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove auth dependency workflow [security-bot5]"
          git push
