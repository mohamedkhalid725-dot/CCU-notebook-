name: Apply Native Biometric Unlock
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[biometric-bot]') && !contains(github.event.head_commit.message, '[biometric-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install biometric dependencies
        run: npm install @aparajita/capacitor-biometric-auth@9.1.2 @aparajita/capacitor-secure-storage@7.1.6
      - name: Apply biometric source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path('src/services/biometric.ts').write_text('''import { Capacitor } from '@capacitor/core';
          import { BiometricAuth } from '@aparajita/capacitor-biometric-auth';
          import { SecureStorage } from '@aparajita/capacitor-secure-storage';

          const BIOMETRIC_PIN_KEY = 'cardiovault_biometric_pin';

          export async function isBiometricAvailable(): Promise<boolean> {
            if (!Capacitor.isNativePlatform()) return false;
            try {
              const result = await BiometricAuth.checkBiometry();
              return result.isAvailable;
            } catch {
              return false;
            }
          }

          export async function enableBiometricUnlock(pin: string): Promise<boolean> {
            if (!Capacitor.isNativePlatform() || !pin) return false;
            if (!(await isBiometricAvailable())) return false;
            await BiometricAuth.authenticate({
              reason: 'Verify your identity to enable fingerprint unlock for CardioVault',
              cancelTitle: 'Cancel',
              allowDeviceCredential: false,
              androidTitle: 'Enable Fingerprint Unlock',
              androidSubtitle: 'Authenticate to protect your clinical notebook',
              androidConfirmationRequired: false,
            });
            await SecureStorage.set(BIOMETRIC_PIN_KEY, pin);
            return true;
          }

          export async function disableBiometricUnlock(): Promise<void> {
            if (!Capacitor.isNativePlatform()) return;
            try { await SecureStorage.remove(BIOMETRIC_PIN_KEY); } catch {}
          }

          export async function authenticateBiometricAndGetPin(): Promise<string | null> {
            if (!Capacitor.isNativePlatform()) return null;
            if (!(await isBiometricAvailable())) return null;
            try {
              await BiometricAuth.authenticate({
                reason: 'Unlock your confidential ICU & CCU clinical notebook',
                cancelTitle: 'Use PIN',
                allowDeviceCredential: false,
                androidTitle: 'Unlock CardioVault',
                androidSubtitle: 'Use your fingerprint to unlock clinical data',
                androidConfirmationRequired: false,
              });
              const stored = await SecureStorage.get(BIOMETRIC_PIN_KEY);
              return typeof stored === 'string' && stored.length > 0 ? stored : null;
            } catch {
              return null;
            }
          }
          ''')

          p = Path('src/components/LockScreen.tsx')
          s = p.read_text()
          s = s.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';")
          s = s.replace("import { AppSecuritySettings } from '../types';", "import { AppSecuritySettings } from '../types';\nimport { authenticateBiometricAndGetPin, isBiometricAvailable } from '../services/biometric';")
          marker = "  const [errorMsg, setErrorMsg] = useState('');\n"
          if "const [biometricAvailable" not in s:
              block = marker + """
          const [biometricAvailable, setBiometricAvailable] = useState(false);
          const [biometricBusy, setBiometricBusy] = useState(false);

          useEffect(() => {
            let mounted = true;
            if (!isSettingUp && securitySettings.biometricEnabled) {
              isBiometricAvailable().then((available) => {
                if (mounted) setBiometricAvailable(available);
              });
            }
            return () => { mounted = false; };
          }, [isSettingUp, securitySettings.biometricEnabled]);

          const handleBiometricUnlock = async () => {
            if (!biometricAvailable || biometricBusy) return;
            setBiometricBusy(true);
            setErrorMsg('');
            try {
              const storedPin = await authenticateBiometricAndGetPin();
              if (!storedPin) {
                setErrorMsg('Biometric unlock failed. Enter your PIN.');
                return;
              }
              await triggerUnlock(storedPin);
            } catch {
              setErrorMsg('Biometric unlock failed. Enter your PIN.');
            } finally {
              setBiometricBusy(false);
            }
          };
          """
              s = s.replace(marker, block, 1)
          keypad = "        {/* Numeric Keypad */}"
          if "Unlock with Fingerprint" not in s:
              bio = """        {!isSettingUp && securitySettings.biometricEnabled && biometricAvailable && (\n          <button type=\"button\" onClick={handleBiometricUnlock} disabled={biometricBusy} className=\"w-full max-w-xs mb-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white font-semibold text-sm shadow-lg transition active:scale-98 flex items-center justify-center gap-2\">\n            <span className=\"text-lg\">☝️</span>\n            {biometricBusy ? 'Waiting for fingerprint…' : 'Unlock with Fingerprint'}\n          </button>\n        )}\n\n"""
              if keypad not in s: raise SystemExit('LockScreen keypad marker missing')
              s = s.replace(keypad, bio + keypad, 1)
          p.write_text(s)

          p = Path('src/components/SecuritySettingsModal.tsx')
          s = p.read_text()
          if "services/biometric" not in s:
              s = s.replace("import { setupNewPin, saveSecuritySettings, exportEncryptedBackup, importEncryptedBackup, wipeAllLocalData } from '../services/storage';", "import { setupNewPin, saveSecuritySettings, exportEncryptedBackup, importEncryptedBackup, wipeAllLocalData } from '../services/storage';\nimport { enableBiometricUnlock, disableBiometricUnlock, isBiometricAvailable } from '../services/biometric';")
          s = s.replace("  const [biometric, setBiometric] = useState<boolean>(false);", "  const [biometric, setBiometric] = useState<boolean>(securitySettings.biometricEnabled);\n  const [biometricStatus, setBiometricStatus] = useState<{ text: string; error?: boolean } | null>(null);")
          if "const handleToggleBiometric" not in s:
              old = """  const handleSavePreferences = () => {\n    const updated: AppSecuritySettings = { ...securitySettings, autoLockMinutes: autoLockMin, biometricEnabled: false };\n    saveSecuritySettings(updated);\n    onUpdateSecurity(updated);\n    setBackupStatus('Security preferences saved');\n    window.setTimeout(() => setBackupStatus(''), 2500);\n  };"""
              new = """  const handleToggleBiometric = async () => {\n    setBiometricStatus(null);\n    if (biometric) {\n      await disableBiometricUnlock();\n      setBiometric(false);\n      const updated: AppSecuritySettings = { ...securitySettings, biometricEnabled: false };\n      saveSecuritySettings(updated);\n      onUpdateSecurity(updated);\n      setBiometricStatus({ text: 'Biometric unlock disabled.' });\n      return;\n    }\n    if (!securitySettings.isPinSet || !currentActivePin) {\n      setBiometricStatus({ text: 'Set and unlock with your PIN first.', error: true });\n      return;\n    }\n    try {\n      if (!(await isBiometricAvailable())) {\n        setBiometricStatus({ text: 'No enrolled biometric authentication is available on this device.', error: true });\n        return;\n      }\n      if (!(await enableBiometricUnlock(currentActivePin))) throw new Error('unavailable');\n      setBiometric(true);\n      const updated: AppSecuritySettings = { ...securitySettings, biometricEnabled: true };\n      saveSecuritySettings(updated);\n      onUpdateSecurity(updated);\n      setBiometricStatus({ text: 'Fingerprint / biometric unlock enabled successfully.' });\n    } catch {\n      setBiometricStatus({ text: 'Biometric verification was cancelled or failed. PIN remains active.', error: true });\n    }\n  };\n\n  const handleSavePreferences = () => {\n    const updated: AppSecuritySettings = { ...securitySettings, autoLockMinutes: autoLockMin, biometricEnabled: biometric };\n    saveSecuritySettings(updated);\n    onUpdateSecurity(updated);\n    setBackupStatus('Security preferences saved');\n    window.setTimeout(() => setBackupStatus(''), 2500);\n  };"""
              if old not in s: raise SystemExit('Security save preferences block missing')
              s = s.replace(old, new, 1)
          old_bio = """            <div className=\"flex items-center justify-between pt-2 border-t border-slate-800/80\">\n              <div className=\"flex items-center gap-2\"><Fingerprint className=\"w-4 h-4 text-slate-500\" /><div><span className=\"font-semibold text-slate-300\">Biometric / Fingerprint Unlock</span><p className=\"text-[10px] text-slate-500\">Native biometric authentication is not available in this build. PIN remains the secure unlock method.</p></div></div>\n              <button type=\"button\" role=\"switch\" aria-checked={false} disabled onClick={() => setBiometric(v => !v)} className=\"relative w-11 h-6 rounded-full border bg-slate-800 border-slate-700 opacity-50 cursor-not-allowed touch-manipulation\" title=\"Native biometric authentication is not available in this build\">\n                <span className=\"absolute top-0.5 w-5 h-5 rounded-full bg-white shadow translate-x-0.5\" />\n              </button>\n            </div>"""
          new_bio = """            <div className=\"flex items-center justify-between pt-2 border-t border-slate-800/80 gap-3\">\n              <div className=\"flex items-center gap-2 min-w-0\"><Fingerprint className={`w-4 h-4 ${biometric ? 'text-emerald-400' : 'text-slate-500'}`} /><div><span className=\"font-semibold text-slate-300\">Biometric / Fingerprint Unlock</span><p className=\"text-[10px] text-slate-500\">Uses Android/iOS native biometric authentication. Your PIN remains the fallback.</p></div></div>\n              <button type=\"button\" role=\"switch\" aria-checked={biometric} onClick={handleToggleBiometric} className={`relative w-11 h-6 rounded-full border transition touch-manipulation ${biometric ? 'bg-emerald-600 border-emerald-500' : 'bg-slate-800 border-slate-700'}`} title=\"Toggle biometric unlock\">\n                <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform ${biometric ? 'translate-x-5' : 'translate-x-0.5'}`} />\n              </button>\n            </div>\n            {biometricStatus && <div className={`p-2 rounded-lg text-[11px] ${biometricStatus.error ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}`}>{biometricStatus.text}</div>}"""
          if old_bio in s: s = s.replace(old_bio, new_bio, 1)
          s = s.replace("      onUpdateSecurity({ ...securitySettings, isPinSet: true });", "      onUpdateSecurity({ ...securitySettings, isPinSet: true, biometricEnabled: false });")
          s = s.replace("  const handleWipeData = () => { wipeAllLocalData(); window.location.reload(); };", "  const handleWipeData = async () => { await disableBiometricUnlock(); wipeAllLocalData(); window.location.reload(); };")
          p.write_text(s)
          PY
      - name: Verify web build
        run: npm run build
      - name: Commit biometric implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/services/biometric.ts src/components/LockScreen.tsx src/components/SecuritySettingsModal.tsx
          git commit -m "feat: add native biometric unlock [biometric-bot]" || exit 0
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-auth-dependency-3.yml .github/workflows/enable-native-biometric.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary biometric workflows [biometric-cleanup]" || true
          git push || true
