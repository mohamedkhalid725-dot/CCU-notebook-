name: Apply Requested Three Fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested patient tab order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/PatientFileModal.tsx')
          s=p.read_text()
          marker="  const tabs: Array<{ id: TabKey; label: string; icon: React.ReactNode; badge?: number | string }> = ["
          start=s.index(marker)
          end=s.index("  ];", start)+4
          block=s[start:end]
          lines=block.splitlines()
          wanted_ids=["overview","history","ecg","vitals_io","examination","labs","echo"]
          def tid(line):
              m=re.search(r"id: '([^']+)'", line)
              return m.group(1) if m else ''
          entries=lines[1:-1]
          moved={tid(x):x for x in entries if tid(x) in wanted_ids}
          if len(moved)!=7: raise SystemExit('Expected seven requested tabs; refusing changes')
          remaining=[x for x in entries if tid(x) not in wanted_ids]
          newblock='\n'.join([lines[0]]+[moved[x] for x in wanted_ids]+remaining+['  ];'])
          p.write_text(s[:start]+newblock+s[end:])
          PY
      - name: Verify requested changes and untouched protected areas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pf=Path('src/components/PatientFileModal.tsx').read_text()
          marker="  const tabs: Array<{ id: TabKey; label: string; icon: React.ReactNode; badge?: number | string }> = ["
          block=pf[pf.index(marker):pf.index('  ];',pf.index(marker))]
          expected=["id: 'overview'","id: 'history'","id: 'ecg'","id: 'vitals_io'","id: 'examination'","id: 'labs'","id: 'echo'"]
          pos=[block.index(x) for x in expected]
          assert pos==sorted(pos)
          calc=''.join(Path(f).read_text() for f in ['src/components/calculators/CriticalCareCalcs.tsx','src/components/calculators/CardiologyCalcs.tsx','src/components/calculators/ThromboembolismCalcs.tsx','src/components/calculators/RenalRespiratoryCalcs.tsx','src/components/calculators/ElectrolytesGeneralCalcs.tsx'])
          assert 'onChange=' in calc and 'type="number"' in calc
          pdf=Path('src/components/PrintableView.tsx').read_text()
          assert 'Latest Progress Notes' not in pdf and 'Latest Progress Note' not in pdf and 'Progress Note' not in pdf
          print('OK')
          PY
      - name: Build web app
        run: npm ci && npm run build
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' 'Temporary trigger for the patient file layout patch.' > PATIENT_LAYOUT_TRIGGER.md
          git add src/components/PatientFileModal.tsx PATIENT_LAYOUT_TRIGGER.md
          git commit -m 'fix: reorder patient file tabs only'
          git rm .github/workflows/apply-requested-three-fixes.yml
          git add PATIENT_LAYOUT_TRIGGER.md
          git commit -m 'chore: remove temporary requested-fixes workflow'
          git push
