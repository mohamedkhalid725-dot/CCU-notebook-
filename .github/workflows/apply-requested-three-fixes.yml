name: Apply Requested Three Fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder requested patient tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/PatientFileModal.tsx')
          s=p.read_text()
          marker="  const tabs: Array<{ id: TabKey; label: string; icon: React.ReactNode; badge?: number | string }> = ["
          start=s.index(marker)
          end=s.index("  ];", start)+4
          block=s[start:end]
          lines=block.splitlines()
          ids=["overview","history","ecg","vitals_io","examination","labs","echo"]
          def tid(line):
              import re
              m=re.search(r"id: '([^']+)'", line)
              return m.group(1) if m else ''
          entries=lines[1:-1]
          moved={tid(x):x for x in entries if tid(x) in ids}
          if len(moved)!=7: raise SystemExit('Expected seven requested tabs')
          remaining=[x for x in entries if tid(x) not in ids]
          ordered=[moved[x] for x in ids]
          newblock='\n'.join([lines[0]]+ordered+remaining+['  ];'])
          p.write_text(s[:start]+newblock+s[end:])
          PY
      - name: Verify calculators and PDF remain intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['src/components/calculators/CriticalCareCalcs.tsx','src/components/calculators/CardiologyCalcs.tsx','src/components/calculators/ThromboembolismCalcs.tsx','src/components/calculators/RenalRespiratoryCalcs.tsx','src/components/calculators/ElectrolytesGeneralCalcs.tsx']
          calc=''.join(Path(f).read_text() for f in files)
          assert 'onChange=' in calc and 'type="number"' in calc
          pdf=Path('src/components/PrintableView.tsx').read_text()
          assert 'Latest Progress Notes' not in pdf and 'Latest Progress Note' not in pdf and 'Progress Note' not in pdf
          print('Requested calculator/PDF checks passed')
          PY
      - name: Build web app
        run: |
          npm ci
          npm run build
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PatientFileModal.tsx
          if ! git diff --cached --quiet; then git commit -m 'fix: reorder patient file tabs only' && git push; fi
