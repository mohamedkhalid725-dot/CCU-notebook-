name: Apply Requested Three Fixes
on:
  push:
    paths:
      - '.github/workflows/apply-requested-three-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PatientFileModal.tsx')
          s = p.read_text()
          old = """    { id: 'overview', label: 'Overview', icon: <User size={15} /> },
    { id: 'vitals_io', label: 'Vitals & I/O', icon: <Droplet size={15} />, badge: (patient.vitals?.length || 0) + (patient.fluidBalanceRecords?.length || patient.ioRecords?.length || 0) || undefined },
    { id: 'ventilation', label: 'Ventilator', icon: <Wind size={15} />, badge: patient.ventilationRecords?.length || (patient.icuVentilator?.mode && patient.icuVentilator.mode !== 'Room Air' ? 1 : undefined) },
    { id: 'history', label: 'History', icon: <History size={15} /> },
    { id: 'examination', label: 'Physical Exam', icon: <Stethoscope size={15} /> },
    { id: 'labs', label: 'Labs & Biomarkers', icon: <TestTube2 size={15} />, badge: patient.labPanels?.length || undefined },
    { id: 'abg', label: 'ABG', icon: <Wind size={15} />, badge: patient.abgRecords?.length || undefined },
    { id: 'ecg', label: '12-Lead ECG', icon: <Activity size={15} />, badge: patient.ecgRecords?.length || undefined },
    { id: 'echo', label: 'Echo (TTE)', icon: <Heart size={15} />, badge: patient.echoStudies?.length || undefined },"""
          new = """    { id: 'overview', label: 'Overview', icon: <User size={15} /> },
    { id: 'history', label: 'History', icon: <History size={15} /> },
    { id: 'ecg', label: '12-Lead ECG', icon: <Activity size={15} />, badge: patient.ecgRecords?.length || undefined },
    { id: 'vitals_io', label: 'Vitals & I/O', icon: <Droplet size={15} />, badge: (patient.vitals?.length || 0) + (patient.fluidBalanceRecords?.length || patient.ioRecords?.length || 0) || undefined },
    { id: 'examination', label: 'Physical Exam', icon: <Stethoscope size={15} /> },
    { id: 'labs', label: 'Labs & Biomarkers', icon: <TestTube2 size={15} />, badge: patient.labPanels?.length || undefined },
    { id: 'echo', label: 'Echo (TTE)', icon: <Heart size={15} />, badge: patient.echoStudies?.length || undefined },"""
          if old not in s:
              raise SystemExit('Expected PatientFileModal tab block not found; refusing unrelated changes')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify requested scope
        run: |
          python - <<'PY'
          from pathlib import Path
          pf=Path('src/components/PatientFileModal.tsx').read_text()
          expected=["{ id: 'overview'", "{ id: 'history'", "{ id: 'ecg'", "{ id: 'vitals_io'", "{ id: 'examination'", "{ id: 'labs'", "{ id: 'echo'"]
          pos=[pf.index(x) for x in expected]
          assert pos==sorted(pos)
          files=['src/components/calculators/CriticalCareCalcs.tsx','src/components/calculators/CardiologyCalcs.tsx','src/components/calculators/ThromboembolismCalcs.tsx','src/components/calculators/RenalRespiratoryCalcs.tsx','src/components/calculators/ElectrolytesGeneralCalcs.tsx']
          calc=''.join(Path(f).read_text() for f in files)
          assert 'onChange=' in calc and 'type=\"number\"' in calc
          pdf=Path('src/components/PrintableView.tsx').read_text()
          assert 'Latest Progress Notes' not in pdf and 'Latest Progress Note' not in pdf and 'Progress Note' not in pdf
          print('Requested scope verified')
          PY
      - name: Build web app
        run: |
          npm ci
          npm run build
      - name: Commit only PatientFileModal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PatientFileModal.tsx
          git diff --cached --quiet || git commit -m 'fix: reorder patient file tabs without changing calculators or PDF'
          git push
