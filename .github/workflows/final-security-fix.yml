name: Final Security Wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[security-bot2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire lock setup and auth lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace("""    return () => unsubscribe();\n  }, [activePin]);""", """    return () => unsubscribe();\n  }, []);""")
          s=s.replace("""        onContinueOffline={async () => {\n          setIsOfflineBypassed(true);\n          setIsUnlocked(false);\n          setActivePin('');\n          setPatients([]);\n        }}\n        securitySettings={securitySettings}""", """        onContinueOffline={async () => {\n          setIsOfflineBypassed(true);\n          setIsUnlocked(false);\n          setActivePin('');\n          setPatients([]);\n        }}\n        securitySettings={securitySettings}""")
          marker="""  if (!isUnlocked) {\n    return <LockScreen securitySettings={securitySettings} onUnlockSuccess={handleUnlockSuccess} />;\n  }"""
          replacement="""  if (!isUnlocked) {\n    const handleInitialPinSetup = async (pin: string) => {\n      const { setupNewPin } = await import('./services/storage');\n      await setupNewPin(pin);\n      await handleUnlockSuccess(pin);\n      setSecuritySettings(getSecuritySettings());\n    };\n    return <LockScreen securitySettings={securitySettings} onUnlockSuccess={handleUnlockSuccess} onSetupInitialPin={handleInitialPinSetup} />;\n  }"""
          if marker not in s: raise SystemExit('LockScreen marker not found')
          s=s.replace(marker,replacement)
          s=s.replace("""      if (document.hidden) {\n        handleLockApp();\n      }""", """      if (document.hidden && securitySettings.autoLockMinutes !== -1) {\n        handleLockApp();\n      }""")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: wire initial PIN setup and auth lock lifecycle [security-bot2]"
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/final-security-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove final security workflow [security-bot2]"
          git push
