name: Build CCU Notebook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap update

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ccunotebook.app',
            appName: 'CCU Notebook',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            },
            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: false,
                providers: ['google.com']
              }
            }
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Get Debug SHA-1
        working-directory: android
        run: |
          chmod +x gradlew

          mkdir -p "$HOME/.config/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          ./gradlew signingReport

      - name: Add Firebase configuration
        env:
          FIREBASE_ANDROID_JSON: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: |
          printf '%s' "$FIREBASE_ANDROID_JSON" > android/app/google-services.json

      - name: Enable Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/build.gradle")
          text = gradle.read_text()

          plugin = "com.google.gms:google-services:4.4.4"

          if plugin not in text:
              text += f'''

          buildscript {{
              repositories {{
                  google()
                  mavenCentral()
              }}
              dependencies {{
                  classpath "{plugin}"
              }}
          }}
          '''

          gradle.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:
              text += '\n\napply plugin: "com.google.gms.google-services"\n'

          app_gradle.write_text(text)
          PY

      - name: Configure Firebase Google Authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          variables = Path("android/variables.gradle")
          text = variables.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1
              )

          variables.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Notebook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
