name: Build Current CardioVault APK

on:
  push:
    paths:
      - '.github/workflows/build-current-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-CURRENT-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Rebuild explicitly from the current main source so the APK cannot be stale.
