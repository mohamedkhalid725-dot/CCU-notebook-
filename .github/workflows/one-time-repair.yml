name: One-time source repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'repair: calculators + pdf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/patient/PatientClinicalCalculators.tsx')
          s=p.read_text()
          old='''const Field:React.FC<FieldProps>=({label,value,onChange,step='1',min,max,inputMode})=>(
  <div className="space-y-1"><div className="text-xs font-medium text-slate-600 dark:text-slate-300">{label}</div><input type="number" inputMode={inputMode||(step==='1'?'numeric':'decimal')} step={step} min={min} max={max} value={value===undefined?'':String(value)} onChange={e=>onChange(e.target.value)} autoComplete="off" className="w-full min-h-12 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 text-base text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" /></div>
);'''
          new='''const Field:React.FC<FieldProps>=({label,value,onChange,step='1',min,max,inputMode})=>(
  <div className="space-y-1"><div className="text-xs font-medium text-slate-600 dark:text-slate-300">{label}</div><input type="text" inputMode={inputMode||(step==='1'?'numeric':'decimal')} enterKeyHint="done" step={step} min={min} max={max} value={value===undefined?'':String(value)} onChange={e=>onChange(e.target.value)} autoComplete="off" autoCorrect="off" spellCheck={false} className="w-full min-h-12 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 text-base text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" /></div>
);'''
          if old not in s: raise SystemExit('calculator Field pattern not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/components/PrintableView.tsx')
          s=p.read_text()
          start=s.find('<div className="md:col-span-3"><Card><SectionHeader icon={<ClipboardList')
          if start<0: raise SystemExit('progress card start not found')
          end=s.find('</Card></div>', start)
          if end<0: raise SystemExit('progress card end not found')
          end += len('</Card></div>')
          s=s[:start]+s[end:]
          old_calc='<div className="md:col-span-2"><Card><SectionHeader icon={<Calculator'
          if old_calc not in s: raise SystemExit('calculator report card not found')
          s=s.replace(old_calc, '<div className="md:col-span-5"><Card><SectionHeader icon={<Calculator', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/patient/PatientClinicalCalculators.tsx src/components/PrintableView.tsx
          git diff --cached --check
          git commit -m 'repair: calculators + pdf'
          git push
