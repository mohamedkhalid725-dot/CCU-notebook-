name: Apply Security Hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[security-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden security
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/services/storage.ts'); s=p.read_text()
          old="""    if (security.isPinSet && activePin) {\n      // Encrypted data format\n      try {\n        const decryptedJson = await decryptData(rawData, activePin, security.pinSalt);\n        const parsed = JSON.parse(decryptedJson);\n        if (Array.isArray(parsed)) {\n          return parsed.map(migratePatientRecord);\n        }\n      } catch (err) {\n        console.warn('Could not decrypt with provided PIN, attempting fallback or re-throw', err);\n        throw err;\n      }\n    } else {\n      // Unencrypted or initial\n      try {\n        const parsed = JSON.parse(rawData);\n        if (Array.isArray(parsed)) {\n          return parsed.map(migratePatientRecord);\n        }\n      } catch {\n        // May be encrypted but no pin provided yet\n      }\n      return INITIAL_PATIENTS.map(migratePatientRecord);\n    }\n  } catch (err) {\n    console.error('Error loading patients:', err);\n    return INITIAL_PATIENTS.map(migratePatientRecord);\n  }\n  return INITIAL_PATIENTS.map(migratePatientRecord);\n}"""
          new="""    if (security.isPinSet) {\n      if (!activePin) throw new Error('PIN required to access encrypted patient data');\n      const decryptedJson = await decryptData(rawData, activePin, security.pinSalt);\n      const parsed = JSON.parse(decryptedJson);\n      if (!Array.isArray(parsed)) throw new Error('Corrupted patient database');\n      return parsed.map(migratePatientRecord);\n    }\n\n    try {\n      const parsed = JSON.parse(rawData);\n      if (Array.isArray(parsed)) return parsed.map(migratePatientRecord);\n    } catch {\n      throw new Error('Patient database is encrypted or corrupted; PIN required');\n    }\n    throw new Error('Invalid patient database');\n  } catch (err) {\n    console.error('Error loading patients:', err);\n    throw err;\n  }\n}"""
          if old not in s: raise SystemExit('storage load block not found')
          s=s.replace(old,new)
          old2="""  const newSecurity: AppSecuritySettings = {\n    isPinSet: true,\n    hashedPin: hash,\n    pinSalt: salt,\n    autoLockMinutes: 5,\n    biometricEnabled: false,\n    lastUnlockedTimestamp: Date.now()\n  };"""
          new2="""  const currentSecurity = getSecuritySettings();\n  const newSecurity: AppSecuritySettings = {\n    ...currentSecurity,\n    isPinSet: true,\n    hashedPin: hash,\n    pinSalt: salt,\n    lastUnlockedTimestamp: Date.now(),\n    biometricEnabled: false\n  };"""
          if old2 not in s: raise SystemExit('storage security block not found')
          s=s.replace(old2,new2); p.write_text(s)

          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace("""        onLoginSuccess={() => { setIsUnlocked(true); }}\n        onContinueOffline={async () => {\n          // Offline access no longer requires a PIN. Use a local empty key context\n          // and attempt to load existing patient data without changing cloud auth.\n          setIsOfflineBypassed(true);\n          setActivePin('');\n          setIsUnlocked(true);\n          try {\n            const loaded = await loadPatients('');\n            setPatients(loaded);\n          } catch (err) {\n            console.error('Failed to load offline patients:', err);\n          }\n        }}""", """        onLoginSuccess={() => {\n          setIsOfflineBypassed(false);\n          setIsUnlocked(false);\n          setActivePin('');\n        }}\n        onContinueOffline={async () => {\n          setIsOfflineBypassed(true);\n          setIsUnlocked(false);\n          setActivePin('');\n          setPatients([]);\n        }}""")
          old_unlock="""  const handleUnlockSuccess = async (pin: string) => {\n    setActivePin(pin);\n    setIsUnlocked(true);\n    setLastActivity(Date.now());\n\n    try {\n      const loaded = await loadPatients(pin);\n\n      // If the user is logged in, restore patients from Cloud first.\n      if (currentUser) {\n        try {\n          const cloudData = await fetchCloudPatients(\n            currentUser.uid\n          );\n\n          if (cloudData.length > 0) {\n            setPatients(cloudData);\n\n            // Save the restored Cloud data locally\n            // using the current PIN.\n            await savePatients(\n              cloudData,\n              pin\n            );\n\n            setCloudSyncStatus('synced');\n            return;\n          }\n        } catch (cloudErr) {\n          console.warn(\n            'Cloud patients restore unavailable, continuing with local encrypted data:',\n            cloudErr\n          );\n          setCloudSyncStatus('error');\n        }\n      }\n\n      // If there is no Cloud data, use local data.\n      setPatients(loaded);\n    } catch (err) {\n      console.warn(\n        'Notice loading patient records:',\n        err\n      );\n    }\n  };"""
          new_unlock="""  const handleUnlockSuccess = async (pin: string) => {\n    try {\n      const loaded = await loadPatients(pin);\n      setActivePin(pin);\n      setIsUnlocked(true);\n      setLastActivity(Date.now());\n      setPatients(loaded);\n\n      if (currentUser) {\n        setCloudSyncStatus('syncing');\n        try {\n          const cloudData = await fetchCloudPatients(currentUser.uid);\n          if (cloudData.length > 0) {\n            setPatients(cloudData);\n            await savePatients(cloudData, pin);\n          } else if (loaded.length > 0) {\n            await syncAllPatientsToCloud(currentUser.uid, loaded);\n          }\n          const cloudSettings = await fetchUserSettingsFromCloud(currentUser.uid);\n          if (cloudSettings) {\n            if (typeof cloudSettings.totalBeds === 'number') {\n              const safeBeds = Math.max(3, Math.floor(cloudSettings.totalBeds));\n              setTotalBeds(safeBeds);\n              localStorage.setItem('icu_total_beds', String(safeBeds));\n            }\n            if (cloudSettings.specialtyMode === 'all' || cloudSettings.specialtyMode === 'ccu' || cloudSettings.specialtyMode === 'icu') setSpecialtyMode(cloudSettings.specialtyMode);\n            if (cloudSettings.fieldConfig) { setFieldConfig(cloudSettings.fieldConfig); saveFieldConfig(cloudSettings.fieldConfig); }\n          }\n          setCloudSyncStatus('synced');\n        } catch (cloudErr) {\n          console.warn('Cloud restore unavailable; local encrypted data remains active:', cloudErr);\n          setCloudSyncStatus('error');\n        }\n      } else {\n        setCloudSyncStatus('offline');\n      }\n    } catch (err) {\n      console.warn('Unlock failed; clinical data remains locked:', err);\n      setIsUnlocked(false);\n      setActivePin('');\n      throw err;\n    }\n  };"""
          if old_unlock not in s: raise SystemExit('App unlock block not found')
          s=s.replace(old_unlock,new_unlock)
          old_auth="""      if (user) {\n        setIsUnlocked(true);\n        setCloudSyncStatus('syncing');\n\n        // Always ensure local data is loaded first as baseline\n        try {\n          const localData = await loadPatients(activePin || '0000');\n          if (localData && localData.length > 0) {\n            setPatients(localData);\n          }\n        } catch {\n          // Local storage empty or needs PIN\n        }\n\n        try {\n          const cloudData = await fetchCloudPatients(user.uid);\n          const cloudSettings = await fetchUserSettingsFromCloud(user.uid);\n\n          if (cloudData && cloudData.length > 0) {\n            setPatients(cloudData);\n\n            if (activePin) {\n              await savePatients(cloudData, activePin);\n            }\n          } else if (patients.length > 0) {\n            try {\n              await syncAllPatientsToCloud(\n                user.uid,\n                patients\n              );\n            } catch (syncErr) {\n              console.warn('Initial cloud sync postponed:', syncErr);\n            }\n          }\n\n          if (cloudSettings) {\n            if (typeof cloudSettings.totalBeds === 'number') {\n              const safeBeds = Math.max(\n                3,\n                Math.floor(cloudSettings.totalBeds)\n              );\n              setTotalBeds(safeBeds);\n              localStorage.setItem(\n                'icu_total_beds',\n                String(safeBeds)\n              );\n            }\n\n            if (\n              cloudSettings.specialtyMode === 'all' ||\n              cloudSettings.specialtyMode === 'ccu' ||\n              cloudSettings.specialtyMode === 'icu'\n            ) {\n              setSpecialtyMode(cloudSettings.specialtyMode);\n            }\n\n            if (cloudSettings.fieldConfig) {\n              setFieldConfig(cloudSettings.fieldConfig);\n              saveFieldConfig(cloudSettings.fieldConfig);\n            }\n          } else {\n            try {\n              await saveUserSettingsToCloud(user.uid, {\n                totalBeds,\n                specialtyMode,\n                fieldConfig\n              });\n            } catch (settingsErr) {\n              console.warn('Initial settings sync postponed:', settingsErr);\n            }\n          }\n\n          setCloudSyncStatus('synced');\n        } catch (err) {\n          console.warn(\n            'Cloud patients synchronization notice (using local offline storage):',\n            err\n          );\n\n          setCloudSyncStatus('error');\n        }\n      } else {"""
          new_auth="""      if (user) {\n        // Firebase authentication must never bypass the local clinical-data lock.\n        setIsUnlocked(false);\n        setActivePin('');\n        setPatients([]);\n        setCloudSyncStatus('offline');\n      } else {"""
          if old_auth not in s: raise SystemExit('App auth block not found')
          s=s.replace(old_auth,new_auth)
          s=s.replace("""      if (document.hidden) {\n        if (\n          securitySettings.autoLockMinutes === 0\n        ) {\n          handleLockApp();\n        }\n      }""", """      if (document.hidden) {\n        handleLockApp();\n      }""")
          p.write_text(s)

          p=Path('src/components/LoginScreen.tsx'); s=p.read_text()
          s=s.replace('Instant Clinical Duty Access (No PIN)','Secure Offline Clinical Access')
          s=s.replace('الدخول المباشر كطبيب مناوب (بدون PIN)','الدخول الآمن كطبيب مناوب')
          s=s.replace('وصول سريري كامل دون إدخال PIN أو ربط حساب سحابي','الوصول السريري المحلي محمي بقفل التطبيق وPIN')
          s=s.replace('Immediate clinical access without entering a PIN or cloud account','Local clinical access protected by the app lock and PIN')
          s=s.replace('// Offline clinical access is intentionally PIN-free. The local encrypted database remains protected by its own data layer when a PIN has been configured.','// Offline access is still protected by the app\'s local security gate.')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/storage.ts src/components/LoginScreen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden clinical data security [security-bot]"
          git push
      - name: Remove one-time workflow
        if: ${{ success() }}
        run: |
          rm -f .github/workflows/apply-security-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove security hardening workflow [security-bot]"
          git push
