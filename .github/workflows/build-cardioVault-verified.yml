name: CardioVault Verified APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/patient/PatientClinicalCalculators.tsx'
      - 'scripts/harden-patient-calculator-inputs.mjs'
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-cardioVault-verified.yml'

permissions:
  contents: read

jobs:
  build-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify latest calculator and keyboard fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type="text"' src/components/patient/PatientClinicalCalculators.tsx
          grep -q 'inputMode=' src/components/patient/PatientClinicalCalculators.tsx
          grep -q 'SOFT_INPUT_ADJUST_RESIZE' android/app/src/main/java/com/ccunotebook/app/MainActivity.java
          grep -q 'windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml
          echo 'Calculator input and Android IME resize fixes are present.'

      - name: Harden patient calculator inputs only
        run: node scripts/harden-patient-calculator-inputs.mjs

      - name: Build web app
        run: CAPACITOR_BUILD=true npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace corrupted debug keystore with a fresh one
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/debug.keystore
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -keypass androiddebugkey \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK integrity and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          keytool -printcert -jarfile "$APK" >/dev/null
          echo "Verified APK: $APK"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-2.1.8-Verified-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
