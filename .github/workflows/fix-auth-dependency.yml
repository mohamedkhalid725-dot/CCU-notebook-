name: Fix Security Auth Dependency
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[security-bot3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix auth subscription lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          needle="    return () => unsubscribe();\n  }, [activePin]);"
          if needle not in s:
              raise SystemExit('Expected auth subscription dependency was not found')
          s=s.replace(needle,"    return () => unsubscribe();\n  }, []);",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: stabilize auth listener during PIN unlock [security-bot3]"
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-auth-dependency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove auth dependency workflow [security-bot3]"
          git push
